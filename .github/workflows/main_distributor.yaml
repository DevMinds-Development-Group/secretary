name: CI/CD Flutter Production

on:
  push:
    branches:
      - release

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Configurar Entorno
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      # 2. Descifrar Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 3. Preparar versión (Extrae del pubspec.yaml)
      - name: Get Version from pubspec
        id: pubspec
        run: |
          BASE_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | xargs)
          FULL_VERSION="${BASE_VERSION}+${{ github.run_number }}"
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV

      # 4. Compilar APK Firmado
      - name: Build APK
        run: flutter build apk --release
        env:
          # Estas variables deben coincidir con tu android/app/build.gradle
          APP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_KEYSTORE_PATH: "upload-keystore.jks"

      - name: Read Changelog
        id: read_changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT  # <--- Esto asegura que el EOF no se pegue al texto
          echo "EOF" >> $GITHUB_OUTPUT

      # 5. Crear Release en GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            ## Detalles del Cambio
            ${{ steps.read_changelog.outputs.CHANGELOG }}

            ---
            ### Información Técnica
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
      
            Descarga el archivo `app-release.apk` abajo para actualizar.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Authenticate and Notify Backend
        run: |
          LOGIN_RESPONSE=$(curl -s -X POST "${{ secrets.BACKEND_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"${{ secrets.CI_USER }}", "password":"${{ secrets.CI_PASSWORD }}"}')
            
            # 2. Extraer el token de la propiedad jwtToken
            # Usamos jq para procesar el JSON de respuesta
            TOKEN=$(echo $LOGIN_RESPONSE | jq -r '.jwtToken')
            
            # Verificación simple de seguridad
            if [ "$TOKEN" == "null" ]; then
              echo "Error: No se pudo obtener el JWT. Revisa las credenciales."
              exit 1
            fi
            
            # 3. Publicar la actualización usando el Token obtenido
            curl -X POST "${{ secrets.BACKEND_URL }}/api/v1/app-versions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d '{
                "versionName": "v${{ env.VERSION }}",
                "downloadUrl": "https://github.com/DevMinds-Development-Group/secretary/releases/latest/download/app-release.apk",
                "publicId": "v${{ env.VERSION }}",
                "releaseNotes": "Actualización menor con resolución de errores y mejoras de rendimiento.",
                "isMandatory": true
              }'